function guide(){const groups=[[&#x27;Аккаунт и профиль&#x27;,[&#x27;01&#x27;,&#x27;02&#x27;,&#x27;03&#x27;,&#x27;04&#x27;,&#x27;05&#x27;]],[&#x27;Специалист ищет проект&#x27;,[&#x27;06&#x27;,&#x27;07&#x27;,&#x27;08&#x27;,&#x27;16&#x27;,&#x27;18&#x27;,&#x27;24&#x27;]],[&#x27;Автор собирает команду&#x27;,[&#x27;09&#x27;,&#x27;10&#x27;,&#x27;11&#x27;,&#x27;12&#x27;,&#x27;17&#x27;,&#x27;19&#x27;]],[&#x27;Поиск кандидатов&#x27;,[&#x27;13&#x27;,&#x27;14&#x27;,&#x27;15&#x27;]],[&#x27;Общение · следующий этап&#x27;,[&#x27;20&#x27;,&#x27;21&#x27;,&#x27;22&#x27;,&#x27;23&#x27;]],[&#x27;Состояния&#x27;,[&#x27;25&#x27;]]];return title(&#x27;Каркас платформы формирования команд&#x27;,&#x27;Все основные экраны и состояния MVP. Выберите экран или пройдите сценарий.&#x27;)+`&lt;div class=&quot;stack&quot;&gt;&lt;div class=&quot;two&quot;&gt;${panel(&#x27;Путь специалиста&#x27;,`&lt;p&gt;Регистрация → профиль → каталог → роль → отклик → общение → решение → команда.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${b(&#x27;Начать с регистрации&#x27;,&#x27;01&#x27;,true)}${b(&#x27;Сразу к проектам&#x27;,&#x27;06&#x27;)}&lt;/div&gt;`)}${panel(&#x27;Путь автора&#x27;,`&lt;p&gt;Создать проект → добавить роли → опубликовать → найти кандидата → обсудить → принять.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${b(&#x27;Создать проект&#x27;,&#x27;10&#x27;,true)}${b(&#x27;Посмотреть отклики&#x27;,&#x27;17&#x27;)}&lt;/div&gt;`)}&lt;/div&gt;&lt;div class=&quot;guide-grid&quot;&gt;${groups.map(([label,ids])=&gt;`&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;${label}&lt;/h2&gt;&lt;div class=&quot;guide-links&quot;&gt;${ids.map(id=&gt;b(id+&#x27; · &#x27;+names[id],id)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${panel(&#x27;Правила, которые заложены в каркас&#x27;,`&lt;ul class=&quot;list&quot;&gt;&lt;li&gt;Один аккаунт может искать проект и создавать собственный.&lt;/li&gt;&lt;li&gt;Обложка необязательна; без неё показывается первая буква названия.&lt;/li&gt;&lt;li&gt;Одна открытая роль — одно место в команде. Название и требования задаёт автор.&lt;/li&gt;&lt;li&gt;Отклик или приглашение открывает переписку, но ещё не делает человека участником.&lt;/li&gt;&lt;li&gt;Автор принимает отклик; специалист принимает приглашение. После этого место занято.&lt;/li&gt;&lt;li&gt;Созвон добровольный. Завершение звонка не означает вступление в команду.&lt;/li&gt;&lt;/ul&gt;`)}${panel(&#x27;Порядок разработки&#x27;,`&lt;p&gt;&lt;strong&gt;Первый этап:&lt;/strong&gt; профили, проекты, роли, поиск, отклики, приглашения, команда.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Следом:&lt;/strong&gt; переписка, назначение встречи и видеозвонок один на один.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Подбор по совместимости, рейтинги, уровни навыков, платежи, групповые звонки и управление задачами оставлены за пределами первой версии.&lt;/p&gt;`)}&lt;/div&gt;`;}
function requests(){const appStatus={none:&#x27;Нет отклика&#x27;,pending:&#x27;Ожидает решения&#x27;,accepted:&#x27;Принят&#x27;,rejected:&#x27;Отклонён&#x27;};return title(&#x27;Мои отклики и приглашения&#x27;,&#x27;Здесь видны ваши заявки и предложения от авторов проектов.&#x27;)+banner()+`&lt;div class=&quot;tabs&quot;&gt;${a(&#x27;Мои отклики&#x27;,&#x27;tab-apps&#x27;,false,`aria-selected=&quot;${state.requestTab===&#x27;applications&#x27;}&quot;`)}${a(&#x27;Входящие приглашения&#x27;,&#x27;tab-invites&#x27;,false,`aria-selected=&quot;${state.requestTab===&#x27;invitations&#x27;}&quot;`)}&lt;/div&gt;`+(state.requestTab===&#x27;applications&#x27;?(state.application===&#x27;none&#x27;?`&lt;div class=&quot;panel empty&quot;&gt;&lt;h2&gt;Откликов пока нет&lt;/h2&gt;&lt;p&gt;Найдите подходящую роль и расскажите автору о себе.&lt;/p&gt;${b(&#x27;Найти проект&#x27;,&#x27;06&#x27;,true)}&lt;/div&gt;`:panel(&#x27;ВелоГород · &#x27;+state.role,`&lt;div class=&quot;row&quot;&gt;${tag(appStatus[state.application])}&lt;/div&gt;&lt;p&gt;Вы отправили отклик. До решения автора вы можете обсудить участие в переписке.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${b(&#x27;Посмотреть проект&#x27;,&#x27;07&#x27;)}${a(&#x27;Открыть переписку&#x27;,&#x27;chat-alex&#x27;,true)}&lt;/div&gt;`)):panel(&#x27;TaskPulse · Backend-разработчик&#x27;,`&lt;div class=&quot;row&quot;&gt;${tag(state.invitation===&#x27;pending&#x27;?&#x27;Ожидает вашего ответа&#x27;:state.invitation===&#x27;accepted&#x27;?&#x27;Принято&#x27;:&#x27;Отклонено&#x27;)}&lt;/div&gt;&lt;p&gt;Елена Орлова приглашает вас в проект.&lt;/p&gt;${b(&#x27;Посмотреть приглашение&#x27;,&#x27;18&#x27;,true)}`));}
function chat(){const who=state.chat===&#x27;maria&#x27;?&#x27;Мария Смирнова&#x27;:state.chat===&#x27;alex&#x27;?&#x27;Алексей Иванов&#x27;:&#x27;Елена Орлова&#x27;;const project=state.chat===&#x27;maria&#x27;?state.projectName:state.chat===&#x27;alex&#x27;?&#x27;ВелоГород&#x27;:&#x27;TaskPulse&#x27;;return title(&#x27;Сообщения&#x27;,&#x27;Переписка доступна после отклика или приглашения.&#x27;)+banner()+`&lt;div class=&quot;chat-layout&quot;&gt;&lt;aside class=&quot;panel chat-list&quot;&gt;${a(&#x27;Елена · TaskPulse&#x27;,&#x27;chat-elena&#x27;)}${state.application!==&#x27;none&#x27;?a(&#x27;Алексей · ВелоГород&#x27;,&#x27;chat-alex&#x27;):&#x27;&#x27;}${state.sentInvitation||state.candidate!==&#x27;none&#x27;?a(&#x27;Мария · &#x27;+state.projectName,&#x27;chat-maria&#x27;):&#x27;&#x27;}&lt;/aside&gt;&lt;section class=&quot;panel stack&quot;&gt;&lt;div class=&quot;row between&quot;&gt;&lt;div&gt;&lt;h2&gt;${who}&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;${h(project)} · ${state.chat===&#x27;maria&#x27;?&#x27;Дизайнер&#x27;:&#x27;Backend-разработчик&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;${b(&#x27;Назначить созвон&#x27;,&#x27;21&#x27;)}${b(&#x27;Позвонить&#x27;,&#x27;22&#x27;,true)}&lt;/div&gt;&lt;/div&gt;&lt;hr class=&quot;rule&quot;&gt;&lt;div class=&quot;messages&quot;&gt;&lt;div class=&quot;message&quot;&gt;&lt;div class=&quot;muted&quot;&gt;${who}&lt;/div&gt;Здравствуйте! Давайте познакомимся и обсудим задачи проекта.&lt;/div&gt;&lt;div class=&quot;message mine&quot;&gt;&lt;div class=&quot;muted&quot;&gt;Вы&lt;/div&gt;Здравствуйте! Готов рассказать о своих навыках и узнать больше о проекте.&lt;/div&gt;${state.messages.filter(m=&gt;m.chat===state.chat).map(m=&gt;`&lt;div class=&quot;message mine&quot;&gt;&lt;div class=&quot;muted&quot;&gt;Вы&lt;/div&gt;${h(m.text)}&lt;/div&gt;`).join(&#x27;&#x27;)}${state.schedule?`&lt;div class=&quot;notice&quot;&gt;&lt;h3&gt;Предложен созвон&lt;/h3&gt;&lt;p&gt;${h(state.schedule.date)} в ${h(state.schedule.time)} · Москва&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Ожидает подтверждения собеседника&lt;/p&gt;${b(&#x27;Изменить время&#x27;,&#x27;21&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;form id=&quot;message-form&quot; class=&quot;stack tight&quot;&gt;&lt;label class=&quot;field&quot;&gt;&lt;span&gt;Сообщение&lt;/span&gt;&lt;textarea name=&quot;message&quot; required placeholder=&quot;Напишите сообщение&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Отправить&lt;/button&gt;${b(&#x27;К проекту&#x27;,state.chat===&#x27;maria&#x27;?&#x27;12&#x27;:&#x27;07&#x27;)}&lt;/div&gt;&lt;/form&gt;&lt;/section&gt;&lt;/div&gt;`;}
function emptyStates(){return title(&#x27;Пустые состояния и ошибки&#x27;,&#x27;Отдельные примеры для согласования поведения интерфейса.&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;stack&quot;&gt;${panel(&#x27;Поиск ничего не нашёл&#x27;,`&lt;p&gt;По выбранным условиям проектов нет. Попробуйте убрать часть фильтров.&lt;/p&gt;${a(&#x27;Сбросить фильтры&#x27;,&#x27;reset-projects&#x27;)}`)}${panel(&#x27;Нет своих проектов&#x27;,`&lt;p&gt;Создайте проект, чтобы рассказать об идее и найти команду.&lt;/p&gt;${b(&#x27;Создать проект&#x27;,&#x27;10&#x27;,true)}`)}${panel(&#x27;Роль уже занята&#x27;,`&lt;p&gt;Пока вы просматривали роль, автор закрыл набор. Новый отклик отправить нельзя.&lt;/p&gt;${b(&#x27;Другие проекты&#x27;,&#x27;06&#x27;)}`)}${panel(&#x27;Приглашение отклонено&#x27;,`&lt;p&gt;Специалист отказался. Он не добавляется в команду, а роль остаётся открытой.&lt;/p&gt;${b(&#x27;Найти другого специалиста&#x27;,&#x27;13&#x27;)}`)}&lt;/div&gt;&lt;div class=&quot;stack&quot;&gt;${panel(&#x27;Обязательное поле не заполнено&#x27;,`&lt;label class=&quot;field&quot;&gt;&lt;span&gt;Название проекта *&lt;/span&gt;&lt;input value=&quot;&quot; aria-invalid=&quot;true&quot; aria-describedby=&quot;wf-field-error&quot;&gt;&lt;/label&gt;&lt;p id=&quot;wf-field-error&quot; role=&quot;alert&quot;&gt;Введите название проекта.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Введённые данные остальных полей сохраняются.&lt;/p&gt;`)}${panel(&#x27;Нет обложки&#x27;,cover(&#x27;Новый проект&#x27;,&#x27;Нейтральная обложка · первая буква названия&#x27;))}${panel(&#x27;Нет доступа к камере&#x27;,`&lt;p&gt;Разрешите доступ к камере в браузере или продолжите без видео.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${a(&#x27;Показать в звонке&#x27;,&#x27;camera-error&#x27;)}${b(&#x27;В переписку&#x27;,&#x27;20&#x27;)}&lt;/div&gt;`)}${panel(&#x27;Связь прервалась&#x27;,`&lt;p&gt;Звонок завершён. Можно попробовать подключиться снова или вернуться к переписке.&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${b(&#x27;Подключиться снова&#x27;,&#x27;23&#x27;)}${b(&#x27;В переписку&#x27;,&#x27;20&#x27;)}&lt;/div&gt;`)}&lt;/div&gt;&lt;/div&gt;`;}
function content(){switch(state.screen){
case &#x27;00&#x27;:return guide();
case &#x27;01&#x27;:return title(&#x27;Создать аккаунт&#x27;,&#x27;Сначала зарегистрируйтесь, затем заполните профиль.&#x27;)+`&lt;form id=&quot;register-form&quot; class=&quot;panel auth-panel stack&quot; novalidate&gt;${err()}${field(&#x27;Имя&#x27;,&#x27;name&#x27;,&#x27;&#x27;,&#x27;text&#x27;,&#x27;&#x27;,true)}${field(&#x27;Email&#x27;,&#x27;email&#x27;,&#x27;&#x27;,&#x27;email&#x27;,&#x27;&#x27;,true)}${field(&#x27;Пароль&#x27;,&#x27;password&#x27;,&#x27;&#x27;,&#x27;password&#x27;,&#x27;Не менее 8 символов&#x27;,true)}&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Зарегистрироваться&lt;/button&gt;&lt;p&gt;Уже есть аккаунт?&lt;/p&gt;${b(&#x27;Войти&#x27;,&#x27;02&#x27;)}&lt;/form&gt;`;
case &#x27;02&#x27;:return title(&#x27;Вход&#x27;,&#x27;Продолжите работу со своим профилем и проектами.&#x27;)+`&lt;form id=&quot;login-form&quot; class=&quot;panel auth-panel stack&quot; novalidate&gt;${err()}${field(&#x27;Email&#x27;,&#x27;email&#x27;,&#x27;&#x27;,&#x27;email&#x27;,&#x27;&#x27;,true)}${field(&#x27;Пароль&#x27;,&#x27;password&#x27;,&#x27;&#x27;,&#x27;password&#x27;,&#x27;&#x27;,true)}&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Войти&lt;/button&gt;${b(&#x27;Создать аккаунт&#x27;,&#x27;01&#x27;)}&lt;/form&gt;`;
case &#x27;03&#x27;:return profileForm(true);
case &#x27;04&#x27;:return ownProfile();
case &#x27;05&#x27;:return profileForm(false);
case &#x27;06&#x27;:{const found=projects.filter(p=&gt;(p.name+&#x27; &#x27;+p.desc).toLowerCase().includes(state.projectQuery.toLowerCase())&amp;&amp;(!state.projectSkill||p.skills.includes(state.projectSkill)));return title(&#x27;Проекты&#x27;,&#x27;Найдите идею и роль, в которых пригодятся ваши навыки.&#x27;,b(&#x27;Создать проект&#x27;,&#x27;10&#x27;,true))+`&lt;div class=&quot;grid catalog&quot;&gt;&lt;aside&gt;&lt;form id=&quot;project-search&quot; class=&quot;panel stack&quot;&gt;${field(&#x27;Поиск&#x27;,&#x27;query&#x27;,state.projectQuery,&#x27;search&#x27;,&#x27;Название или описание&#x27;)}${select(&#x27;Навык&#x27;,&#x27;skill&#x27;,[&#x27;Все навыки&#x27;,&#x27;Python&#x27;,&#x27;FastAPI&#x27;,&#x27;Figma&#x27;,&#x27;JavaScript&#x27;],state.projectSkill||&#x27;Все навыки&#x27;)}&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;Найти&lt;/button&gt;${a(&#x27;Сбросить&#x27;,&#x27;reset-projects&#x27;)}&lt;/form&gt;&lt;/aside&gt;&lt;section class=&quot;stack&quot;&gt;&lt;p class=&quot;muted&quot;&gt;Найдено проектов: ${found.length}&lt;/p&gt;${found.length?found.map(projectCard).join(&#x27;&#x27;):`&lt;div class=&quot;panel empty&quot;&gt;&lt;h2&gt;Ничего не найдено&lt;/h2&gt;&lt;p&gt;Попробуйте изменить запрос или убрать фильтр.&lt;/p&gt;${a(&#x27;Сбросить фильтры&#x27;,&#x27;reset-projects&#x27;)}&lt;/div&gt;`}&lt;/section&gt;&lt;/div&gt;`;}
case &#x27;07&#x27;:return projectDetail();
