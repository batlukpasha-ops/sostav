<style>
#team-mvp-wireframes{--wf-bg:light-dark(#f3f3f3,#191919);--wf-paper:light-dark(#fff,#242424);--wf-ink:light-dark(#222,#eee);--wf-muted:light-dark(#666,#b8b8b8);--wf-line:light-dark(#ccc,#555);--wf-soft:light-dark(#ececec,#333);--wf-fill:light-dark(#303030,#ddd);--wf-onfill:light-dark(#fff,#171717);color:var(--wf-ink);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;width:100%;color-scheme:light dark}

#team-mvp-wireframes .wf-caption,#team-mvp-wireframes .muted{color:var(--wf-muted)}

#team-mvp-wireframes .wf-review{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0 12px}

#team-mvp-wireframes .app-nav{display:flex;flex-wrap:wrap;gap:4px}

#team-mvp-wireframes .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}

#team-mvp-wireframes .panel{background:var(--wf-paper);border:1px solid var(--wf-line);border-radius:4px;padding:20px;min-width:0}
#team-mvp-wireframes .form-panel{max-width:690px;margin:0 auto}
#team-mvp-wireframes .auth-panel{max-width:490px;margin:16px auto}
#team-mvp-wireframes .notice{padding:13px 16px;border:1px dashed var(--wf-line);background:var(--wf-soft);border-radius:4px}
#team-mvp-wireframes .notice[role=alert]{border-color:var(--wf-ink)}
#team-mvp-wireframes .tag{display:inline-block;background:var(--wf-soft);border:1px solid var(--wf-line);padding:3px 9px;border-radius:3px;font-size:12px}
#team-mvp-wireframes .cover{min-height:170px;border:1px dashed var(--wf-line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;background:var(--wf-soft);padding:16px;border-radius:4px}
#team-mvp-wireframes .cover .initial{font-size:40px;font-weight:500}
#team-mvp-wireframes label.field{display:flex;flex-direction:column;gap:6px;min-width:0}
#team-mvp-wireframes input,#team-mvp-wireframes select,#team-mvp-wireframes textarea{width:100%;padding:10px 12px;border:1px solid var(--wf-line);border-radius:3px;background:var(--wf-paper);min-width:0}
#team-mvp-wireframes input[type=checkbox]{width:auto}

#team-mvp-wireframes textarea{min-height:110px;resize:vertical}
#team-mvp-wireframes label small{font-size:12px;color:var(--wf-muted)}
#team-mvp-wireframes .check{display:flex;gap:8px;align-items:flex-start}
#team-mvp-wireframes .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
#team-mvp-wireframes .avatar{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;background:var(--wf-soft);border:1px solid var(--wf-line);border-radius:50%;flex-shrink:0}
#team-mvp-wireframes .rule{border:0;border-top:1px solid var(--wf-line);width:100%;margin:4px 0}
#team-mvp-wireframes .list{margin:0;padding-left:20px}
#team-mvp-wireframes .guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
#team-mvp-wireframes .guide-links{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin-top:10px}
#team-mvp-wireframes .guide-links button{text-align:left}
#team-mvp-wireframes .chat-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
#team-mvp-wireframes .chat-list{display:flex;flex-direction:column;gap:8px}
#team-mvp-wireframes .chat-list button{text-align:left}
#team-mvp-wireframes .messages{display:flex;flex-direction:column;gap:14px;min-height:240px;padding:16px 0}
#team-mvp-wireframes .message{max-width:85%;background:var(--wf-soft);border:1px solid var(--wf-line);padding:12px 15px;border-radius:4px;overflow-wrap:anywhere}
#team-mvp-wireframes .message.mine{align-self:flex-end;background:var(--wf-paper)}
#team-mvp-wireframes .message .muted{font-size:12px;margin-bottom:4px}
#team-mvp-wireframes .video{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;min-height:350px;background:var(--wf-soft);border:1px dashed var(--wf-line);border-radius:4px;text-align:center;padding:24px}
#team-mvp-wireframes .self-video{min-height:160px}
#team-mvp-wireframes .video-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}
#team-mvp-wireframes .empty{text-align:center;padding:42px 20px;display:flex;align-items:center;flex-direction:column;gap:14px}
#team-mvp-wireframes .app-footer{padding:22px 28px;border-top:1px solid var(--wf-line);background:var(--wf-paper);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--wf-muted);font-size:12px}
#team-mvp-wireframes .wf-review-bottom{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 0;font-size:12px;color:var(--wf-muted)}
#team-mvp-wireframes .table-wrap{overflow-x:auto}
#team-mvp-wireframes table{border-collapse:collapse;width:100%;text-align:left}
#team-mvp-wireframes th,#team-mvp-wireframes td{border-bottom:1px solid var(--wf-line);padding:12px 8px;font-weight:400;vertical-align:top}
#team-mvp-wireframes .error{padding:10px 0;color:var(--wf-ink);font-weight:500}
@media(max-width:800px){#team-mvp-wireframes .grid,#team-mvp-wireframes .catalog,#team-mvp-wireframes .chat-layout,#team-mvp-wireframes .video-layout{grid-template-columns:minmax(0,1fr)}#team-mvp-wireframes .guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#team-mvp-wireframes .wf-review-controls{padding-right:0}#team-mvp-wireframes .chat-list{flex-direction:row;flex-wrap:wrap}#team-mvp-wireframes .self-video{min-height:110px}}
@media(max-width:520px){#team-mvp-wireframes main{padding:18px}#team-mvp-wireframes .app-header{padding:16px}#team-mvp-wireframes .two,#team-mvp-wireframes .three,#team-mvp-wireframes .guide-grid{grid-template-columns:minmax(0,1fr)}#team-mvp-wireframes .wf-review-controls{width:100%}#team-mvp-wireframes .wf-review-controls label{width:100%}#team-mvp-wireframes .wf-review select{max-width:none;flex:1}#team-mvp-wireframes button{min-height:44px}#team-mvp-wireframes input,#team-mvp-wireframes select,#team-mvp-wireframes textarea{font-size:16px}#team-mvp-wireframes .panel{padding:16px}#team-mvp-wireframes .app-nav{width:100%}#team-mvp-wireframes .video{min-height:230px}#team-mvp-wireframes .message{max-width:100%}}
</style>
<script>
(() => {
const root=document.getElementById('team-mvp-wireframes');
const host=root.querySelector('#wf-product'),picker=root.querySelector('#wf-screen-picker');
const screens=[['00','Карта экранов и сценариев'],['01','Регистрация'],['02','Вход'],['03','Первое заполнение профиля'],['04','Мой профиль'],['05','Редактирование профиля'],['06','Каталог проектов'],['07','Проект — специалист'],['08','Отклик на роль'],['09','Мои проекты'],['10','Создание проекта'],['11','Создание и редактирование роли'],['12','Проект — автор'],['13','Каталог специалистов'],['14','Профиль специалиста'],['15','Приглашение на роль'],['16','Мои отклики и приглашения'],['17','Отклики на роль — автор'],['18','Полученное приглашение'],['19','Команда — автор'],['20','Переписка'],['21','Назначение созвона'],['22','Входящий звонок'],['23','Видеозвонок'],['24','Проект — участник'],['25','Пустые состояния и ошибки']];
const names=Object.fromEntries(screens),history=[];
let state={screen:'00',name:'Павел',specialty:'Backend-разработчик',bio:'Изучаю Python и FastAPI. Хочу получить опыт работы над общим продуктом.',skills:['Python','FastAPI','PostgreSQL'],portfolio:'',experience:'Учебный REST API на FastAPI',application:'none',invitation:'pending',candidate:'pending',sentInvitation:false,joined:false,role:'Backend-разработчик',projectName:'StudyFlow',projectDescription:'Сервис для планирования самостоятельного обучения.',roleName:'Дизайнер',projectQuery:'',projectSkill:'',peopleQuery:'',peopleSkill:'',requestTab:'applications',chat:'elena',messages:[],schedule:null,mic:true,camera:true,videoIssue:'',error:'',notice:'',published:false};
try{const saved=localStorage.getItem('sostav-wireframe-screen');if(saved&&names[saved])state.screen=saved;}catch{}
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(label,to,primary=false)=>`<button type="button" data-go="${to}" class="${primary?'primary':''}">${h(label)}</button>`;
const a=(label,action,primary=false,extra='')=>`<button type="button" data-action="${action}" class="${primary?'primary':''}" ${extra}>${h(label)}</button>`;
const tag=s=>`<span class="tag">${h(s)}</span>`;
const title=(heading,sub='',actions='')=>`<div class="title-row"><div><h1 id="wf-page-title">${h(heading)}</h1>${sub?`<p class="muted">${h(sub)}</p>`:''}</div><div class="row">${actions}</div></div>`;
const panel=(heading,content)=>`<section class="panel stack"><h2>${h(heading)}</h2>${content}</section>`;
const note=s=>`<div class="notice">${h(s)}</div>`;
const field=(label,name,value='',type='text',hint='',required=false)=>`<label class="field"><span>${h(label)}${required?' *':''}</span><input name="${name}" type="${type}" value="${h(value)}" ${required?'required':''} autocomplete="off">${hint?`<small>${h(hint)}</small>`:''}</label>`;
const area=(label,name,value='',hint='',required=false)=>`<label class="field"><span>${h(label)}${required?' *':''}</span><textarea name="${name}" ${required?'required':''}>${h(value)}</textarea>${hint?`<small>${h(hint)}</small>`:''}</label>`;
const select=(label,name,options,value='')=>`<label class="field"><span>${h(label)}</span><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${h(o)}</option>`).join('')}</select></label>`;
const cover=(name='Проект',caption='Обложка автора · необязательно')=>`<div class="cover"><span class="initial">${h(name.charAt(0))}</span><span class="muted">${h(caption)}</span></div>`;
const err=()=>state.error?`<p class="error" role="alert">${h(state.error)}</p>`:'';
const banner=()=>state.notice?note(state.notice):'';
const skills=()=>`<div class="row">${state.skills.map(s=>tag(s)).join('')}</div>`;
function frame(content,auth=true){return `<header class="app-header"><button type="button" class="quiet wordmark" data-go="06">СОСТАВ</button>${auth?`<nav class="app-nav" aria-label="Основные разделы">${[['06','Проекты'],['13','Специалисты'],['20','Сообщения'],['16','Отклики и приглашения'],['09','Мои проекты'],['04','Профиль']].map(([id,label])=>`<button type="button" class="quiet" data-go="${id}" ${state.screen===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`:`<div class="row">${b('Войти','02')}${b('Зарегистрироваться','01')}</div>`}</header><main>${content}</main><footer class="app-footer"><span>Состав · платформа формирования команд</span><div class="row">${b('Проекты','06')}${b('Специалисты','13')}</div></footer>`;}
function projectCard(p){return `<article class="panel stack tight"><div class="row between"><h2>${h(p.name)}</h2>${tag(p.roles+' открытые роли')}</div><p>${h(p.desc)}</p><div class="row">${p.skills.map(tag).join('')}</div><div class="row between"><span class="muted">Автор: ${h(p.author)}</span>${a('Посмотреть проект','open-project',false,`data-id="${p.id}"`)}</div></article>`;}
const projects=[{id:'velo',name:'ВелоГород',desc:'Онлайн-каталог велосипедов и заявки на аренду.',skills:['Python','FastAPI','Figma'],author:'Алексей Иванов',roles:3},{id:'task',name:'TaskPulse',desc:'Простой сервис организации задач небольшой команды.',skills:['Python','PostgreSQL','JavaScript'],author:'Елена Орлова',roles:2},{id:'study',name:'StudyFlow',desc:'Планирование самостоятельного обучения и учебных целей.',skills:['Figma','JavaScript'],author:'Павел',roles:2}];
const roleText={Дизайнер:{tasks:'Разработать фирменный стиль и логотип, макеты главной страницы и каталога.',skills:['Figma','Photoshop','Illustrator'],expect:'Опыт работы не требуется. Главное — навыки и желание учиться.'},'Backend-разработчик':{tasks:'Реализовать каталог велосипедов и обработку заявок на аренду.',skills:['Python','FastAPI','PostgreSQL'],expect:'Подойдут учебные проекты. Готовность разбираться вместе.'},'Frontend-разработчик':{tasks:'Сверстать страницы по макетам и подключить формы к серверу.',skills:['HTML','CSS','JavaScript'],expect:'Подойдут учебные проекты. Внимание к удобству интерфейса.'}};
function roleCard(name,owner=false){const r=roleText[name];const closed=owner&&state.candidate==='accepted'&&name==='Дизайнер';return `<article class="panel stack tight"><div class="row between"><h2>${h(name)}</h2>${tag(closed?'Место занято':'Открыта · 1 место')}</div><p>${h(r.tasks)}</p><div class="row">${r.skills.map(tag).join('')}</div><p class="muted">${h(r.expect)}</p><div class="row">${owner?`${a('Редактировать','edit-role',false,`data-role="${h(name)}"`)}${b('Отклики на роль','17')}`:a(state.application==='pending'&&state.role===name?'Отклик отправлен':'Откликнуться',state.application==='pending'&&state.role===name?'sent-role':'choose-role',true,`data-role="${h(name)}"`)}</div></article>`;}
function profileForm(first=false){return title(first?'Расскажите о себе':'Редактирование профиля',first?'Вы сможете искать проекты и создавать собственные с одного аккаунта.':'Навыки и работы помогут автору понять, чем вы можете помочь.')+`<form id="profile-form" class="panel form-panel stack" novalidate>${err()}${field('Имя','name',state.name,'text','Как к вам обращаться',true)}${field('Основная специализация','specialty',state.specialty,'text','Например: backend-разработчик; можно заполнить позже')}${area('О себе','bio',state.bio)}${field('Навыки','skills',state.skills.join(', '),'text','Перечислите через запятую')}${!first?area('Опыт и учебные проекты','experience',state.experience)+field('Ссылка на портфолио','portfolio',state.portfolio,'url','GitHub или ссылка на работы — необязательно'):''}<div class="row"><button class="primary" type="submit">${first?'Сохранить и перейти к проектам':'Сохранить изменения'}</button>${b('Позже','06')}</div></form>`;}
function ownProfile(){return title('Мой профиль','Так вас видят другие участники.',b('Редактировать','05',true))+`<div class="grid"><div class="stack">${panel(state.name,`<p>${h(state.specialty||'Специализация пока не указана')}</p><p>${h(state.bio)}</p>${skills()}`)}${panel('Опыт',`<p>${h(state.experience||'Добавьте учебный проект или небольшой опыт работы.')}</p>`)}${panel('Портфолио',`<p>${state.portfolio?h(state.portfolio):'Ссылки на работы пока не добавлены.'}</p>${b('Добавить работы','05')}`)}</div><aside class="stack">${panel('Мои действия',b('Найти проект','06')+b('Создать проект','10'))}${panel('Проекты',`<p>Вы можете одновременно участвовать в чужих проектах и собирать свою команду.</p>${b('Мои проекты','09')}`)}</aside></div>`;}
function projectDetail(mode='specialist'){const owner=mode==='owner',member=mode==='member';const name=owner?state.projectName:member?'TaskPulse':state.openProject==='task'?'TaskPulse':'ВелоГород';return title(name,owner?'Вы управляете этим проектом':member?'Вы участник команды':'Платформа для аренды велосипедов',owner?`${a('Редактировать проект','edit-project')}${b('Добавить роль','11',true)}`:member?b('Переписка','20',true):'')+banner()+`<div class="grid"><div class="stack">${panel('О проекте',`<p>${h(owner?state.projectDescription:member?'Простой сервис организации задач небольшой команды.':'Помогаем выбрать велосипед, посмотреть условия и отправить заявку на аренду.')}</p><h3>Цель первой версии</h3><p>${owner?'План обучения, список целей и отметка выполнения.':member?'Список задач, участники и состояние выполнения.':'Главная страница, каталог велосипедов и заявка на аренду.'}</p>`)}${owner?`<div class="tabs">${b('Открытые роли','12')}${b('Отклики','17')}${b('Команда','19')}</div>`:''}${member?panel('Ваше участие',`${tag('Участник команды')}<p>Роль: Backend-разработчик</p><p>Автор принял участие после вашего согласия с приглашением.</p>`):`<h2>Открытые роли</h2>${Object.keys(roleText).map(r=>roleCard(r,owner)).join('')}`}${panel('Команда',`<p>${owner?'Павел — автор проекта':member?'Елена Орлова — автор проекта':'Алексей Иванов — автор проекта'}</p>${member?'<p>Павел — Backend-разработчик</p>':owner&&state.candidate==='accepted'?'<p>Мария Смирнова — дизайнер</p>':'<p class="muted">Новые участники появятся после принятия отклика или приглашения.</p>'}`)}</div><aside class="stack">${cover(name)}${panel('Автор проекта',`<p>${owner?'Павел':member?'Елена Орлова':'Алексей Иванов'}</p>${owner?b('Мой профиль','04'):b('Посмотреть профиль','14')}`)}${panel('Статус',`<p>${owner&&!state.published?'Проект подготовлен к публикации':'Набор команды открыт'}</p><p>${member?'2 участника':'1 участник'} · ${owner&&state.candidate==='accepted'?'2':'3'} открытые роли</p>${owner&&!state.published?a('Опубликовать проект','publish',true):''}`)}</aside></div>`;}
function candidateCard(name='Мария Смирнова'){return `<article class="panel stack tight"><div class="row between"><h2>${name}</h2>${tag(name.startsWith('Мария')?'Дизайнер':'Backend-разработчик')}</div><p>${name.startsWith('Мария')?'Учусь делать понятные интерфейсы. Есть несколько учебных макетов.':'Изучаю Python. Сделал учебный REST API.'}</p><div class="row">${(name.startsWith('Мария')?['Figma','Photoshop']:['Python','FastAPI']).map(tag).join('')}</div><div class="row">${b('Профиль','14')}${b('Пригласить на роль','15',true)}</div></article>`;}
function guide(){const groups=[['Аккаунт и профиль',['01','02','03','04','05']],['Специалист ищет проект',['06','07','08','16','18','24']],['Автор собирает команду',['09','10','11','12','17','19']],['Поиск кандидатов',['13','14','15']],['Общение · следующий этап',['20','21','22','23']],['Состояния',['25']]];return title('Каркас платформы формирования команд','Все основные экраны и состояния MVP. Выберите экран или пройдите сценарий.')+`<div class="stack"><div class="two">${panel('Путь специалиста',`<p>Регистрация → профиль → каталог → роль → отклик → общение → решение → команда.</p><div class="row">${b('Начать с регистрации','01',true)}${b('Сразу к проектам','06')}</div>`)}${panel('Путь автора',`<p>Создать проект → добавить роли → опубликовать → найти кандидата → обсудить → принять.</p><div class="row">${b('Создать проект','10',true)}${b('Посмотреть отклики','17')}</div>`)}</div><div class="guide-grid">${groups.map(([label,ids])=>`<section class="panel"><h2>${label}</h2><div class="guide-links">${ids.map(id=>b(id+' · '+names[id],id)).join('')}</div></section>`).join('')}</div>${panel('Правила, которые заложены в каркас',`<ul class="list"><li>Один аккаунт может искать проект и создавать собственный.</li><li>Обложка необязательна; без неё показывается первая буква названия.</li><li>Одна открытая роль — одно место в команде. Название и требования задаёт автор.</li><li>Отклик или приглашение открывает переписку, но ещё не делает человека участником.</li><li>Автор принимает отклик; специалист принимает приглашение. После этого место занято.</li><li>Созвон добровольный. Завершение звонка не означает вступление в команду.</li></ul>`)}${panel('Порядок разработки',`<p><strong>Первый этап:</strong> профили, проекты, роли, поиск, отклики, приглашения, команда.</p><p><strong>Следом:</strong> переписка, назначение встречи и видеозвонок один на один.</p><p class="muted">Подбор по совместимости, рейтинги, уровни навыков, платежи, групповые звонки и управление задачами оставлены за case '17':return title('Отклики на роль',`${state.projectName} · Дизайнер`,b('К проекту','12'))+banner()+`<div class="stack">${panel('Мария Смирнова',`<div class="row">${tag(state.candidate==='pending'?'Ожидает решения':state.candidate==='accepted'?'Принят':'Отклонён')}${tag('Figma')}${tag('Photoshop')}</div><p>Хочу поучаствовать в разработке интерфейса. Есть учебные макеты, готова учиться вместе с командой.</p><div class="row">${b('Профиль кандидата','14')}${a('Открыть переписку','chat-maria')}${state.candidate==='pending'?a('Принять в команду','accept-candidate',true)+a('Отклонить','reject-candidate'):state.candidate==='accepted'?b('Посмотреть команду','19',true):''}</div>`)}${panel('Исходящие приглашения',state.sentInvitation?`<p>Мария Смирнова · Дизайнер · ожидает ответа</p>${a('Открыть переписку','chat-maria')}`:`<p>Пока никого не приглашали.</p>${b('Найти специалиста','13')}`)}</div>`;
case '18':return title('Приглашение в проект','TaskPulse · Backend-разработчик')+`<div class="grid"><div class="stack">${panel('Предложение от Елены Орловой',`<div class="row">${tag(state.invitation==='pending'?'Ожидает вашего ответа':state.invitation==='accepted'?'Вы приняли приглашение':'Вы отклонили приглашение')}</div><p>Здравствуйте! Ищем backend-разработчика для сервиса задач. Ваши учебные проекты подходят — давайте познакомимся.</p><h3>Задачи</h3><p>Реализовать работу со списком задач и участниками команды.</p><div class="row">${['Python','FastAPI','PostgreSQL'].map(tag).join('')}</div><div class="row">${a('Обсудить в переписке','chat-elena')}${state.invitation==='pending'?a('Принять приглашение','accept-invitation',true)+a('Отклонить','reject-invitation'):state.invitation==='accepted'?b('Перейти в команду','24',true):b('Найти другой проект','06')}</div>`)}${note('После принятия вы станете участником проекта. Созвон перед решением необязателен.')}</div><aside>${panel('TaskPulse','<p>Сервис организации задач небольшой команды.</p><p>Автор: Елена Орлова</p>')}</aside></div>`;
case '19':return title('Команда проекта',state.projectName,b('К управлению проектом','12'))+banner()+`<div class="stack">${panel('Участники',`<div class="row between"><div><h3>Павел</h3><p class="muted">Автор проекта</p></div>${tag('В команде')}</div>${state.candidate==='accepted'?'<hr class="rule"><div class="row between"><div><h3>Мария Смирнова</h3><p class="muted">Дизайнер</p></div><span class="tag">В команде</span></div>':'<p class="muted">Специалистов пока нет. Отправленные приглашения здесь не отображаются как участники.</p>'}`)}${panel('Открытые места',`<p>${state.candidate==='accepted'?'Frontend-разработчик · набор открыт':'Дизайнер и frontend-разработчик · набор открыт'}</p><div class="row">${b('Просмотреть отклики','17',true)}${b('Найти кандидатов','13')}</div>`)}</div>`;
case '20':return chat();
case '21':return title('Предложить время созвона','Встреча один на один внутри платформы')+`<form id="schedule-form" class="panel form-panel stack" novalidate>${err()}${field('Дата','date',state.schedule?.date||'2026-10-15','date','',true)}${field('Время','time',state.schedule?.time||'18:00','time','Москва · UTC+3',true)}${area('Что обсудим','topic','Задачи роли, ожидания и удобный формат совместной работы.')}<div class="row"><button type="submit" class="primary">Отправить предложение</button>${b('Отмена','20')}</div></form>`;
case '22':return title('Звонок','Состояние вызова · пример входящего звонка')+`<section class="panel empty"><span class="avatar">ЕО</span><h2>Елена Орлова звонит вам</h2><p>TaskPulse · Backend-разработчик</p><div class="video self-video"><p>Предпросмотр вашей камеры</p><p class="muted">В этом макете камера не включается</p></div><div class="row">${a('Принять звонок','accept-call',true)}${a('Отклонить','decline-call')}</div></section>`;
case '23':return title('Видеозвонок','TaskPulse · Елена Орлова')+`<div class="stack">${state.videoIssue?note(state.videoIssue):''}<div class="video-layout"><section class="video"><span class="avatar">ЕО</span><h2>Видео собеседника</h2><p class="muted">Демонстрационная область видеопотока</p></section><aside class="stack"><div class="video self-video"><strong>${state.camera?'Ваше видео':'Камера выключена'}</strong><p class="muted">Вы</p></div><div class="notice">${state.mic?'Микрофон включён':'Микрофон выключен'}</div></aside></div><div class="row">${a(state.mic?'Выключить микрофон':'Включить микрофон','toggle-mic',false,`aria-pressed="${!state.mic}"`)}${a(state.camera?'Выключить камеру':'Включить камеру','toggle-camera',false,`aria-pressed="${!state.camera}"`)}${a('Завершить звонок','end-call',true)}</div>${note('Завершение разговора не меняет решение об участии в проекте. Оно принимается отдельно в отклике или приглашении.')}</div>`;
case '24':return state.joined?projectDetail('member'):title('Участие в проекте')+`<div class="panel empty"><h2>Вы ещё не участник команды</h2><p>Сначала нужно согласовать участие. Отклик, переписка и звонок сами по себе не добавляют вас в команду.</p>${b('Открыть приглашение','18',true)}</div>`;
case '25':return emptyStates();
default:return guide();}}
function render(){picker.value=state.screen;root.querySelector('#wf-phase').textContent=['20','21','22','23'].includes(state.screen)?'Следующий этап: общение. Звук и видео в макете не передаются.':'Первый этап: основной процесс формирования команды.';host.innerHTML=frame(content(),!['01','02'].includes(state.screen));root.querySelector('#wf-current').textContent=state.screen+' / '+names[state.screen];}
function save(){try{localStorage.setItem('sostav-wireframe-screen',state.screen);}catch{}}
function go(id){if(!names[id])return;history.push(state.screen);state.screen=id;state.error='';state.notice='';render();save();}
picker.innerHTML=screens.map(([id,name])=>`<option value="${id}">${id} · ${name}</option>`).join('');picker.addEventListener('change',()=>go(picker.value));
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||!root.contains(el))return;if(el.dataset.go){go(el.dataset.go);return;}const act=el.dataset.action;if(!act)return;switch(act){
case 'back':state.screen=history.pop()||'00';state.error='';state.notice='';break;
case 'open-project':state.openProject=el.dataset.id;go(el.dataset.id==='study'?'12':'07');return;
case 'choose-role':state.role=el.dataset.role;go('08');return;
case 'sent-role':go('16');return;
case 'edit-role':state.roleName=el.dataset.role;go('11');return;
case 'edit-project':state.editProject=true;go('10');return;
case 'publish':state.published=true;state.notice='Проект опубликован. Теперь специалисты могут найти его в каталоге.';break;
case 'reset-projects':state.projectQuery='';state.projectSkill='';go('06');return;
case 'reset-people':state.peopleQuery='';state.peopleSkill='';go('13');return;
case 'tab-apps':state.requestTab='applications';break;
case 'tab-invites':state.requestTab='invitations';break;
case 'chat-alex':state.chat='alex';go('20');return;
case 'chat-elena':state.chat='elena';go('20');return;
case 'chat-maria':state.chat='maria';go('20');return;
case 'accept-candidate':state.candidate='accepted';go('19');state.notice='Отклик принят. Мария добавлена в команду, роль дизайнера занята.';break;
case 'reject-candidate':state.candidate='rejected';state.notice='Отклик отклонён. Кандидат не добавлен в команду, роль остаётся открытой.';break;
case 'accept-invitation':state.invitation='accepted';state.joined=true;go('24');state.notice='Вы приняли приглашение и стали участником команды TaskPulse.';break;
case 'reject-invitation':state.invitation='rejected';state.notice='Приглашение отклонено. Вы не добавлены в команду.';break;
case 'accept-call':state.camera=true;state.mic=true;state.videoIssue='';go('23');return;
case 'decline-call':go('20');state.notice='Звонок отклонён. Можно продолжить переписку.';break;
case 'end-call':go('20');state.notice='Звонок завершён. Решение об участии не изменилось.';break;
case 'toggle-mic':state.mic=!state.mic;break;
case 'toggle-camera':state.camera=!state.camera;break;
case 'camera-error':state.camera=false;state.videoIssue='Нет доступа к камере. Разрешите доступ в браузере или продолжите без видео.';go('23');return;
}render();save();});
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(!(form instanceof HTMLFormElement))return;const d=Object.fromEntries(new FormData(form).entries());state.error='';
const fail=msg=>{state.error=msg;const values=[...form.elements].filter(n=>n.name).map(n=>[n.name,n.value]);render();for(const [name,value]of values){const n=host.querySelector(`[name="${name}"]`);if(n&&n.type!=='file')n.value=value;}return false;};
switch(form.id){
case 'register-form':if(!d.name.trim()||!/^\S+@\S+\.\S+$/.test(d.email)||d.password.length<8)return fail('Укажите имя, корректный email и пароль длиной не менее 8 символов.');state.name=d.name.trim();go('03');return;
case 'login-form':if(!/^\S+@\S+\.\S+$/.test(d.email)||!d.password)return fail('Укажите корректный email и пароль.');go('06');return;
case 'profile-form':if(!d.name.trim())return fail('Введите имя.');state.name=d.name.trim();state.specialty=d.specialty;state.bio=d.bio;state.skills=d.skills.split(',').map(s=>s.trim()).filter(Boolean);if('experience'in d)state.experience=d.experience;if('portfolio'in d)state.portfolio=d.portfolio;go(state.screen==='03'?'06':'04');return;
case 'project-search':state.projectQuery=d.query;state.projectSkill=d.skill==='Все навыки'?'':d.skill;break;
case 'people-search':state.peopleQuery=d.query;state.peopleSkill=d.skill==='Все навыки'?'':d.skill;break;
case 'apply-form':if(!d.message.trim())return fail('Напишите короткое сообщение автору.');state.application='pending';state.requestTab='applications';state.chat='alex';go('16');state.notice='Отклик отправлен. Можно открыть переписку с автором.';break;
case 'project-form':if(!d.name.trim()||!d.description.trim()||!d.details.trim()||!d.goal.trim())return fail('Заполните название, описание и цель первой версии.');state.projectName=d.name.trim();state.projectDescription=d.description;const edit=state.editProject;state.editProject=false;go(edit?'12':'11');return;
case 'role-form':if(!d.name.trim()||!d.tasks.trim())return fail('Укажите название роли и задачи участника.');state.roleName=d.name;go('12');state.notice='Роль сохранена. Проверьте проект перед публикацией.';break;
case 'invite-form':if(!d.message.trim())return fail('Добавьте сообщение специалисту.');state.sentInvitation=true;state.chat='maria';go('17');state.notice='Приглашение отправлено. Специалист ещё не стал участником команды.';break;
case 'message-form':if(!d.message.trim())return;state.messages.push({chat:state.chat,text:d.message.trim()});break;
case 'schedule-form':if(!d.date||!d.time)return fail('Выберите дату и время встречи.');state.schedule={date:d.date,time:d.time,topic:d.topic};go('20');state.notice='Предложение о созвоне отправлено. Ожидается ответ собеседника.';break;
}render();save();});
render();
})();
</script>
